<div class="layout">

  <!-- Mobile Overlay -->
  <div
    class="sidebar-overlay"
    *ngIf="sidebarOpen"
    (click)="closeSidebar()">
  </div>

  <!-- Sidebar Wrapper -->
  <aside
    class="layout-sidebar"
    [class.mobile-open]="sidebarOpen">

    <app-sidebar
  [isOpen]="sidebarOpen"
  (closeSidebar)="closeSidebar()">
</app-sidebar>

  </aside>

  <!-- Main Content -->
  <div class="main-content">

    <header class="navbar">

  <app-navbar
    (menuToggle)="toggleSidebar()">
  </app-navbar>

</header>

    <main class="content">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
