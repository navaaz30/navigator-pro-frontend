<div class="employee-layout">

    <!-- Overlay -->
    <div
        class="sidebar-overlay"
        *ngIf="sidebarOpen"
        (click)="closeSidebar()">
    </div>

    <app-employee-sidebar
        [isOpen]="sidebarOpen"
        (closeSidebar)="closeSidebar()">
    </app-employee-sidebar>

    <div class="main-content">

        <app-employee-navbar
            (menuToggle)="toggleSidebar()">
        </app-employee-navbar>

        <div class="page-content">
            <router-outlet></router-outlet>
        </div>

    </div>

</div>
