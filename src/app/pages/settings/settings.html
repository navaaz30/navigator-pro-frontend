<!-- ==========================================
     Toast Notification
========================================== -->

<div
    *ngIf="showToast"
    class="toast"
    [ngClass]="toastType">

    <mat-icon>
        {{ toastType === 'success' ? 'check_circle' : 'error' }}
    </mat-icon>

    {{ toastMessage }}

</div>

<!-- ==========================================
     Page Header
========================================== -->

<div class="page-header">

    <h1>Settings</h1>

    <p class="subtitle">

        Manage your profile, security and company preferences.

    </p>

</div>

<!-- ==========================================
     Profile Card
========================================== -->

<div class="settings-card">

    <div class="card-header">

        <h2>Profile Information</h2>

        <p>Update your administrator profile.</p>

    </div>

    <div class="profile-section">

        <div class="profile-avatar">

            <img
                src="https://i.pravatar.cc/150?img=12"
                alt="Admin">

            <button
                class="change-photo"
                (click)="changePhoto()">

                Change Photo

            </button>

        </div>

        <div class="profile-form">

            <div class="form-grid">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        [(ngModel)]="fullName">

                </div>

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        [(ngModel)]="email">

                </div>

                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="text"
                        [(ngModel)]="phone">

                </div>

                <div class="form-group">

                    <label>Designation</label>

                    <input
                        type="text"
                        [(ngModel)]="designation">

                </div>

            </div>

        </div>

    </div>

    <div class="save-section">

        <button
            class="save-btn"
            (click)="saveProfile()">

            <mat-icon>save</mat-icon>

            Save Profile

        </button>

    </div>

</div>

<!-- ==========================================
     Security Card
========================================== -->

<div class="bottom-grid">

<div class="settings-card">

    <div class="card-header">

        <h2>Security</h2>

        <p>Manage your account password.</p>

    </div>

    <div class="form-grid">

        <div class="form-group">

            <label>Current Password</label>

            <input
                type="password"
                [(ngModel)]="currentPassword">

        </div>

        <div class="form-group">

            <label>New Password</label>

            <input
                type="password"
                [(ngModel)]="newPassword">

        </div>

        <div class="form-group full-width">

            <label>Confirm Password</label>

            <input
                type="password"
                [(ngModel)]="confirmPassword">

        </div>

    </div>

    <div class="save-section">

        <button
            class="save-btn"
            (click)="updatePassword()">

            <mat-icon>lock_reset</mat-icon>

            Update Password

        </button>

    </div>

</div>

<!-- ==========================================
     Company Card
========================================== -->

<div class="settings-card">

    <div class="card-header">

        <h2>Company Information</h2>

        <p>Manage your organization details.</p>

    </div>

    <div class="form-grid">

        <div class="form-group">

            <label>Company Name</label>

            <input
                type="text"
                [(ngModel)]="companyName">

        </div>

        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                [(ngModel)]="companyEmail">

        </div>

        <div class="form-group">

            <label>Phone Number</label>

            <input
                type="text"
                [(ngModel)]="companyPhone">

        </div>

        <div class="form-group">

            <label>Website</label>

            <input
                type="text"
                [(ngModel)]="website">

        </div>

        <div class="form-group full-width">

            <label>Office Address</label>

            <textarea
                rows="3"
                [(ngModel)]="address">

            </textarea>

        </div>

    </div>

    <div class="save-section">

        <button
            class="save-btn"
            (click)="saveCompany()">

            <mat-icon>business</mat-icon>

            Save Company Details

        </button>

    </div>

</div>

</div>
